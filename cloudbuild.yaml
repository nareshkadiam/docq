# Builds the Docker image and pushes it to Artifact Registry.
# _IMAGE is passed in by `gcloud builds submit --substitutions`.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
options:
  # Required when a custom service account runs the build: logs go to Cloud Logging only.
  logging: CLOUD_LOGGING_ONLY
